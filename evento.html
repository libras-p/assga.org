<main class="eventos-container">
    <h2><i class="fas fa-calendar-check"></i> Eventos Disponíveis</h2>
    <div id="listaEventosPagina"></div>
</main>

<!-- No final do body, antes de </body>, adicione: -->
<script>
    function escapeHtml(text) {
        if (!text) return '';
        return String(text).replace(/[&<>"']/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            if (m === "'") return '&#039;';
            return m;
        });
    }

    function carregarEventosPagina() {
        const container = document.getElementById('listaEventosPagina');
        const eventos = JSON.parse(localStorage.getItem('assga_eventos') || '[]');
        if (eventos.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#888;">Nenhum evento cadastrado no momento.</p>';
            return;
        }
        const statusMap = { aberto: 'Inscrições Abertas', andamento: 'Em andamento', fechado: 'Inscrições Encerradas' };
        const statusClass = { aberto: 'status-aberto', andamento: 'status-andamento', fechado: 'status-fechado' };
        container.innerHTML = eventos.map(e => `
            <div class="evento-card">
                <span class="status ${statusClass[e.status] || 'status-aberto'}"><i class="fas fa-circle-check"></i> ${statusMap[e.status] || 'Aberto'}</span>
                <h3><i class="fas fa-calendar-days"></i> ${escapeHtml(e.titulo)}</h3>
                <div class="evento-grid-info">
                    <div class="info-item"><i class="fas fa-calendar-days"></i> ${escapeHtml(e.data || 'Data a definir')}</div>
                    <div class="info-item"><i class="fas fa-location-dot"></i> ${escapeHtml(e.local || 'Local a definir')}</div>
                    <div class="info-item"><i class="fas fa-ticket"></i> Vagas: limitadas</div>
                    <div class="info-item"><i class="fas fa-users"></i> Público: Todos</div>
                </div>
                <p class="descricao">${escapeHtml(e.descricao || '')}</p>
                ${e.preco ? `<div class="preco"><i class="fas fa-money-bill-wave"></i> R$ ${escapeHtml(e.preco)}</div>` : ''}
                ${e.status !== 'fechado' ? `<div style="margin-top:15px;"><a href="pagamento.html" class="btn-inscricao"><i class="fas fa-ticket"></i> Fazer inscrição <i class="fas fa-arrow-right"></i></a></div>` : ''}
            </div>
        `).join('');
    }

    document.addEventListener('DOMContentLoaded', carregarEventosPagina);
</script>
