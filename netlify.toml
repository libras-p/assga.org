[build]
  publish = "."
  command = "echo 'Build concluído!'"

# Redirecionamentos para SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers para cache e segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Cache-Control = "public, max-age=3600"

# Headers específicos para arquivos HTML (não cachear para sempre)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=600"

# Headers para imagens e assets (cache longo)
[[headers]]
  for = "/src/imagens/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"