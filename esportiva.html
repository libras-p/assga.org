<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esportivas | ASSGA</title>
    <link rel="icon" href="src/imagens/Assga_foto.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #dbe9f8, #eef3f8 48%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 51, 102, 0.25);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 3px solid #004aad;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #003366;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 i {
            color: #004aad;
        }

        .header .btn-voltar {
            background: #003366;
            color: #fff;
            padding: 10px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .header .btn-voltar:hover {
            background: #004aad;
            transform: translateY(-2px);
        }

        .esportivas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .card-esportiva {
            background: #f8faff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #d9e1eb;
            display: flex;
            flex-direction: column;
        }

        .card-esportiva:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 51, 102, 0.15);
        }

        .card-esportiva .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #e6f0fa;
            border-bottom: 4px solid #b22234;
        }

        .card-esportiva .card-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-esportiva .card-body .titulo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #003366;
            margin-bottom: 6px;
        }

        .card-esportiva .card-body .data {
            font-size: 0.9rem;
            color: #667085;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-esportiva .card-body .descricao {
            color: #2c3e50;
            font-size: 0.95rem;
            line-height: 1.5;
            flex: 1;
            word-break: break-word;
        }

        .card-esportiva .card-body .descricao a {
            color: #004aad;
            text-decoration: none;
            font-weight: 600;
        }
        .card-esportiva .card-body .descricao a:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #667085;
        }
        .empty i {
            font-size: 4rem;
            color: #b22234;
            margin-bottom: 15px;
        }
        .empty p {
            font-size: 1.2rem;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .esportivas-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-futbol"></i> Nossas Esportivas</h1>
            <a href="index.html" class="btn-voltar"><i class="fas fa-arrow-left"></i> VOLTAR</a>
        </div>
        <div id="esportivasContainer" class="esportivas-grid"></div>
    </div>

    <script>
        const STORAGE_ESPORTIVAS = 'assga_esportivas';

        function getEsportivas() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_ESPORTIVAS) || '[]');
            } catch {
                return [];
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"']/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                if (m === "'") return '&#039;';
                return m;
            });
        }

        function isLink(text) {
            return /^https?:\/\/\S+/i.test(text.trim());
        }

        function formatConteudo(texto) {
            if (!texto) return '';
            if (isLink(texto)) {
                return `<a href="${escapeHtml(texto.trim())}" target="_blank" rel="noopener">${escapeHtml(texto.trim())}</a>`;
            }
            return escapeHtml(texto);
        }

        function renderizarEsportivas() {
            const container = document.getElementById('esportivasContainer');
            const lista = getEsportivas();

            if (lista.length === 0) {
                container.innerHTML = `
                    <div class="empty" style="grid-column:1/-1;">
                        <i class="fas fa-futbol"></i>
                        <p>Nenhuma esportiva cadastrada ainda.<br>
                    </div>
                `;
                return;
            }

            const itens = lista.slice(0, 5);
            container.innerHTML = itens.map(item => `
                <div class="card-esportiva">
                    <img class="card-img" 
                         src="${item.imagem && item.imagem.startsWith('data:image') ? item.imagem : 'src/imagens/avatar-padrao.jpg'}" 
                         alt="${escapeHtml(item.titulo)}" />
                    <div class="card-body">
                        <div class="titulo">${escapeHtml(item.titulo)}</div>
                        ${item.data ? `<div class="data"><i class="fas fa-calendar-alt"></i> ${escapeHtml(item.data)}</div>` : ''}
                        <div class="descricao">${formatConteudo(item.texto)}</div>
                    </div>
                </div>
            `).join('');
        }

        renderizarEsportivas();

        window.addEventListener('storage', function(e) {
            if (e.key === STORAGE_ESPORTIVAS) {
                renderizarEsportivas();
            }
        });
    </script>
</body>
</html>
