<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ASSGA - Associação Desportiva. Conheça nossa diretoria e equipe.">
    <meta name="theme-color" content="#003366">
    <title>Diretoria - ASSGA</title>

    <link rel="icon" href="src/imagens/Assga_foto.jpg" type="image/jpeg">
    <link rel="shortcut icon" href="src/imagens/Assga_foto.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ===== MESMO ESTILO DO ORIGINAL (resumido) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        html { scroll-behavior: smooth; }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h2 { text-align: center; margin: 45px 0 35px; color: #003366; font-size: 2.5em; font-weight: 800; text-shadow: 2px 2px 4px rgba(0,0,0,.1); }
        h2 i { color: #004aad; margin-right: 10px; }

        /* HEADER (mesmo do index) */
        header {
            background: linear-gradient(135deg, #003366 0%, #004aad 100%);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 9999;
            box-shadow: 0 8px 32px rgba(0,51,102,.3);
        }
        .logo-area { display: flex; align-items: center; gap: 15px; cursor: pointer; transition: transform .3s ease; }
        .logo-area:hover { transform: scale(1.05); }
        .logo-area a { display: flex; text-decoration: none; }
        .logo-area img { width: 56px; height: 68px; object-fit: cover; border-radius: 8px; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #ffd700, #ffed4e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .menu {
            list-style: none;
            display: inline-grid;
            grid-auto-flow: column;
            gap: 10px;
            margin-left: auto;
            align-items: center;
        }
        .menu li { position: relative; }
        .menu a {
            display: block;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            padding: 12px 17px;
            border-radius: 25px;
            transition: all .4s ease;
        }
        .menu a i { margin-right: 7px; color: #fff; transition: .3s; }
        .menu a:hover {
            color: #003366;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            box-shadow: 0 8px 24px rgba(255,215,0,.4);
            transform: translateY(-3px);
        }
        .menu a:hover i { color: #fff; }
        .menu-toggle {
            display: none;
            width: 45px;
            height: 45px;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            cursor: pointer;
            margin-left: auto;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: transparent;
            transition: .3s;
        }
        .menu-toggle:hover { background: rgba(255,255,255,.12); }
        .menu-toggle i { pointer-events: none; color: #fff; }

        .page-banner {
            background: linear-gradient(135deg, #003366 0%, #004aad 100%);
            padding: 60px 20px;
            text-align: center;
            color: #fff;
        }
        .page-banner h1 { font-size: 3em; font-weight: 900; margin-bottom: 10px; }
        .page-banner h1 i { color: #ffd700; margin-right: 15px; }
        .page-banner p { font-size: 1.2em; opacity: .9; max-width: 700px; margin: 0 auto; }

        .diretoria-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; flex: 1; }
        .diretoria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        .membro-card {
            background: #fff;
            border-radius: 20px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,.1);
            transition: all .4s ease;
            border-bottom: 5px solid #004aad;
        }
        .membro-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 50px rgba(0,74,173,.2);
            border-bottom-color: #ffd700;
        }
        .membro-card .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #003366, #004aad);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffd700;
            font-size: 3em;
            box-shadow: 0 8px 20px rgba(0,51,102,.2);
        }
        .membro-card h3 { color: #003366; font-size: 1.4em; margin-bottom: 5px; }
        .membro-card .cargo { color: #004aad; font-weight: 700; font-size: 1em; display: block; margin-bottom: 8px; }
        .membro-card .cargo i { margin-right: 5px; }
        .membro-card p { color: #666; font-size: 0.95em; line-height: 1.5; }
        .membro-card .contato { margin-top: 15px; display: flex; justify-content: center; gap: 12px; }
        .membro-card .contato a {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: #004aad;
            border-radius: 50%;
            font-size: 18px;
            text-decoration: none;
            transition: all .3s ease;
        }
        .membro-card .contato a:hover { background: #ffd700; color: #003366; transform: scale(1.15); }

        /* FALE CONOSCO e FOOTER (mesmo do index) */
        /* (omitido para brevidade) */

        @media (max-width: 767px) {
            header { padding: 12px 15px; }
            .logo-area { gap: 10px; }
            .logo-area img { width: 48px; height: 60px; }
            .logo { font-size: 18px; }
            .menu-toggle { display: flex; }
            .menu {
                display: none;
                position: absolute;
                top: 76px;
                left: 15px;
                right: 15px;
                width: calc(100% - 30px);
                grid-auto-flow: row;
                gap: 4px;
                margin: 0;
                padding: 15px;
                background: linear-gradient(135deg, rgba(0,51,102,.98), rgba(0,74,173,.98));
                border-radius: 15px;
                box-shadow: 0 15px 35px rgba(0,0,0,.30);
            }
            .menu.active { display: grid; }
            .menu li { width: 100%; padding: 2px 0; }
            .menu a { width: 100%; text-align: left; padding: 13px 15px; }
            .menu a i { width: 25px; text-align: center; color: #fff; }
            .page-banner { padding: 40px 15px; }
            .page-banner h1 { font-size: 2em; }
            .page-banner p { font-size: 1em; }
            .diretoria-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
            .membro-card { padding: 20px 15px; }
            .membro-card .avatar { width: 70px; height: 70px; font-size: 2em; }
            .membro-card h3 { font-size: 1.1em; }
            .membro-card .cargo { font-size: 0.85em; }
            .membro-card p { font-size: 0.85em; }
            h2 { font-size: 1.8em; margin: 30px 0; }
            .info-card { width: 100%; }
            .footer-container { flex-direction: column; text-align: center; }
            .footer-redes { margin-top: 15px; }
        }
        @media (max-width: 480px) {
            .diretoria-grid { grid-template-columns: 1fr; }
        }
        @media (min-width: 768px) and (max-width: 1023px) {
            header { padding: 15px; }
            .logo { font-size: 20px; }
            .menu { gap: 4px; }
            .menu a { font-size: 12px; padding: 10px 9px; }
            .menu a i { margin-right: 4px; }
            .info-card { width: 45%; }
        }
        a:focus, button:focus { outline: 3px solid #ffd700; outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) {
            * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
        }
    </style>
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="logo-area">
            <a href="index.html" aria-label="Página inicial ASSGA">
                <img src="src/imagens/Assga_foto.jpg" alt="Logo da ASSGA">
            </a>
            <div class="logo">ASSGA</div>
        </div>
        <button class="menu-toggle" id="menuToggle" onclick="toggleMenu()" aria-label="Abrir menu" aria-controls="menu" aria-expanded="false" type="button">
            <i id="menuIcon" class="fas fa-bars"></i>
        </button>
        <nav aria-label="Menu principal">
            <ul class="menu" id="menu">
                <li><a href="index.html"><i class="fas fa-house"></i> Home</a></li>
                <li><a href="historia.html"><i class="fas fa-book-open"></i> História</a></li>
                <li><a href="esportiva.html"><i class="fas fa-futbol"></i> Esportiva</a></li>
                <li><a href="evento.html"><i class="fas fa-calendar-days"></i> Eventos</a></li>
                <li><a href="estatuto.html"><i class="fas fa-file-contract"></i> Estatuto</a></li>
                <li><a href="diretoria.html"><i class="fas fa-users"></i> Diretoria</a></li>
                <li><a href="login.html"><i class="fas fa-id-card"></i> Área do Sócio</a></li>
                <li><a href="admin.html"><i class="fas fa-user-shield"></i> Admin</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== BANNER ===== -->
    <section class="page-banner">
        <h1><i class="fas fa-users"></i> Nossa Diretoria</h1>
        <p>Conheça a equipe que faz a ASSGA acontecer.</p>
    </section>

    <!-- ===== DIRETORIA (dinâmica) ===== -->
    <main class="diretoria-container">
        <h2><i class="fas fa-user-tie"></i> Membros da Diretoria</h2>
        <div class="diretoria-grid" id="listaDiretoriaPagina"></div>
    </main>

    <!-- ===== FALE CONOSCO e FOOTER (omitidos) ===== -->
    <!-- ... -->

    <script>
        // Menu mobile (mesmo dos outros)
        function toggleMenu() { /* ... */ }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"']/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                if (m === "'") return '&#039;';
                return m;
            });
        }

        function carregarDiretoria() {
            const container = document.getElementById('listaDiretoriaPagina');
            const directors = JSON.parse(localStorage.getItem('assga_diretoria') || '[]');
            if (directors.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">Nenhum membro cadastrado.</p>';
                return;
            }
            container.innerHTML = directors.map(d => `
                <div class="membro-card">
                    <div class="avatar"><i class="fas fa-user"></i></div>
                    <h3>${escapeHtml(d.nome)}</h3>
                    <span class="cargo"><i class="fas fa-star"></i> ${escapeHtml(d.cargo)}</span>
                    <p>${escapeHtml(d.descricao || '')}</p>
                    <div class="contato">
                        ${d.email ? `<a href="mailto:${escapeHtml(d.email)}" aria-label="Enviar email"><i class="fas fa-envelope"></i></a>` : ''}
                        ${d.telefone ? `<a href="tel:${escapeHtml(d.telefone)}" aria-label="Ligar"><i class="fas fa-phone"></i></a>` : ''}
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', carregarDiretoria);
    </script>
</body>
</html>
