<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - ASSGA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== ESTILOS GERAIS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }
        .admin-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #003366 0%, #002244 100%);
            color: #fff;
            padding: 25px 0;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-brand {
            padding: 0 25px 30px;
            font-size: 24px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,.1);
        }
        .sidebar-brand i {
            color: #ffd700;
        }
        .sidebar-brand span {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-menu {
            list-style: none;
            padding: 20px 0 0;
        }
        .sidebar-menu li {
            padding: 0 15px;
            margin-bottom: 4px;
        }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-radius: 12px;
            color: rgba(255,255,255,.7);
            text-decoration: none;
            font-weight: 600;
            transition: all .3s;
            font-size: 15px;
        }
        .sidebar-menu a i {
            width: 24px;
            text-align: center;
            font-size: 18px;
        }
        .sidebar-menu a:hover {
            background: rgba(255,255,255,.10);
            color: #fff;
        }
        .sidebar-menu a.active {
            background: rgba(255,215,0,.15);
            color: #ffd700;
            box-shadow: inset 4px 0 0 #ffd700;
        }
        .sidebar-menu .submenu {
            padding-left: 35px;
            font-size: 14px;
        }
        .sidebar-menu .submenu a {
            padding: 10px 20px;
            font-weight: 400;
        }

        /* ===== CONTEÚDO PRINCIPAL ===== */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .page-header h1 {
            color: #003366;
            font-size: 28px;
        }
        .page-header h1 i {
            color: #ffd700;
            margin-right: 10px;
        }
        .page-header .actions {
            display: flex;
            gap: 10px;
        }

        /* ===== CARDS ===== */
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
            margin-bottom: 25px;
        }
        .card-title {
            color: #003366;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 12px;
        }
        .card-title i {
            color: #ffd700;
        }

        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #003366;
        }
        label i {
            margin-right: 6px;
            color: #004aad;
        }
        input[type="text"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: .3s;
            background: #fafafa;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: #004aad;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,74,173,.15);
            background: #fff;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all .3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: #003366;
            color: #fff;
        }
        .btn-primary:hover {
            background: #004aad;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0,51,102,.3);
        }
        .btn-success {
            background: #28a745;
            color: #fff;
        }
        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #dc3545;
            color: #fff;
        }
        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        .btn-warning {
            background: #ffc107;
            color: #333;
        }
        .btn-warning:hover {
            background: #e0a800;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #6c757d;
            color: #fff;
        }
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 0.8rem;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .list-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-left: 4px solid #004aad;
        }
        .list-item .info {
            flex: 1;
        }
        .list-item .info strong {
            color: #003366;
        }
        .list-item .info .desc {
            color: #555;
            font-size: 0.9rem;
            display: block;
        }
        .list-item .actions {
            display: flex;
            gap: 6px;
        }
        .badge {
            display: inline-block;
            background: #003366;
            color: #ffd700;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .empty-msg {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
        .image-preview {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-top: 10px;
            border: 2px solid #ddd;
        }
        .hidden {
            display: none;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #28a745;
            color: #fff;
            padding: 14px 25px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,.2);
            font-weight: 700;
            z-index: 9999;
            transition: .5s;
            opacity: 0;
            transform: translateY(30px);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.error {
            background: #dc3545;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .admin-wrapper {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                padding: 15px;
            }
            .sidebar-brand {
                padding: 0 0 15px;
                justify-content: center;
            }
            .sidebar-menu {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 10px 0 0;
            }
            .sidebar-menu li {
                padding: 0;
                width: auto;
            }
            .sidebar-menu a {
                padding: 10px 16px;
                font-size: 13px;
            }
            .main-content {
                padding: 15px;
            }
            .page-header h1 {
                font-size: 22px;
            }
        }
        @media (max-width: 480px) {
            .list-item {
                flex-direction: column;
                align-items: stretch;
            }
            .list-item .actions {
                justify-content: flex-end;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-crown"></i>
                <span>ASSGA Admin</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" class="active" data-tab="esportiva"><i class="fas fa-futbol"></i> Esportiva</a></li>
                <!-- Futuras abas podem ser adicionadas aqui -->
                <li><a href="#" data-tab="home"><i class="fas fa-house"></i> Home</a></li>
                <li><a href="#" data-tab="historia"><i class="fas fa-book-open"></i> História</a></li>
                <li><a href="#" data-tab="eventos"><i class="fas fa-calendar-days"></i> Eventos</a></li>
                <li><a href="#" data-tab="estatuto"><i class="fas fa-file-contract"></i> Estatuto</a></li>
                <li><a href="#" data-tab="diretoria"><i class="fas fa-users"></i> Diretoria</a></li>
                <li><hr style="border-color:rgba(255,255,255,.1); margin: 15px 0;"></li>
                <li><a href="index.html" target="_blank"><i class="fas fa-eye"></i> Ver Site</a></li>
            </ul>
        </aside>

        <!-- ===== CONTEÚDO PRINCIPAL ===== -->
        <main class="main-content">
            <div class="page-header">
                <h1><i class="fas fa-futbol"></i> Gerenciar Esportiva</h1>
                <div class="actions">
                    <button class="btn btn-secondary" id="btnRecarregar"><i class="fas fa-undo-alt"></i> Recarregar</button>
                    <a href="esportiva.html" target="_blank" class="btn btn-primary"><i class="fas fa-eye"></i> Visualizar</a>
                </div>
            </div>

            <!-- ===== FORMULÁRIO ===== -->
            <form id="formEsportiva">
                <div class="card">
                    <div class="card-title"><i class="fas fa-cog"></i> Configurações Gerais</div>

                    <div class="form-group">
                        <label for="titulo"><i class="fas fa-heading"></i> Título do Banner</label>
                        <input type="text" id="titulo" placeholder="Ex: Nossa Esportiva" />
                    </div>
                    <div class="form-group">
                        <label for="subtitulo"><i class="fas fa-align-left"></i> Subtítulo</label>
                        <input type="text" id="subtitulo" placeholder="Ex: Conheça as modalidades e campeonatos" />
                    </div>
                    <div class="form-group">
                        <label for="imagemUpload"><i class="fas fa-image"></i> Imagem de Capa</label>
                        <input type="file" id="imagemUpload" accept="image/*" />
                        <div id="previewContainer" class="hidden">
                            <img id="imagemPreview" class="image-preview" alt="Pré-visualização" />
                            <button type="button" class="btn btn-danger btn-sm" id="removerImagem" style="margin-top:8px;">
                                <i class="fas fa-trash"></i> Remover
                            </button>
                        </div>
                        <input type="hidden" id="imagemBase64" />
                    </div>
                    <div class="form-group">
                        <label for="data"><i class="fas fa-calendar-alt"></i> Data de Destaque</label>
                        <input type="text" id="data" placeholder="Ex: 23 de julho de 2024" />
                    </div>
                    <div class="form-group">
                        <label for="textoExtra"><i class="fas fa-paragraph"></i> Texto Extra (HTML permitido)</label>
                        <textarea id="textoExtra" rows="3" placeholder="Ex: &lt;p&gt;A ASSGA oferece diversas modalidades...&lt;/p&gt;"></textarea>
                    </div>
                </div>

                <!-- ===== MODALIDADES ===== -->
                <div class="card">
                    <div class="card-title"><i class="fas fa-list"></i> Modalidades</div>
                    <div id="modalidadesList"></div>
                    <button type="button" class="btn btn-success" id="addModalidadeBtn">
                        <i class="fas fa-plus-circle"></i> Adicionar Modalidade
                    </button>
                </div>

                <!-- ===== CAMPEONATOS ===== -->
                <div class="card">
                    <div class="card-title"><i class="fas fa-trophy"></i> Campeonatos</div>
                    <div id="campeonatosList"></div>
                    <button type="button" class="btn btn-success" id="addCampeonatoBtn">
                        <i class="fas fa-plus-circle"></i> Adicionar Campeonato
                    </button>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar Alterações</button>
                </div>
            </form>
        </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">Dados salvos!</div>

    <script>
        // =============================================================
        // ESCAPE HTML
        // =============================================================
        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"']/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                if (m === "'") return '&#039;';
                return m;
            });
        }

        // =============================================================
        // TOAST
        // =============================================================
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // =============================================================
        // GERENCIAR DADOS
        // =============================================================
        let currentData = {
            titulo: '',
            subtitulo: '',
            imagem: '',
            data: '',
            textoExtra: '',
            modalidades: [],
            campeonatos: []
        };

        function carregarDados() {
            const stored = JSON.parse(localStorage.getItem('assga_conteudos') || '{}');
            const data = stored.esportiva || {
                titulo: 'Nossa Esportiva',
                subtitulo: 'Conheça as modalidades e campeonatos da ASSGA.',
                imagem: '',
                data: '',
                textoExtra: '',
                modalidades: [],
                campeonatos: []
            };
            currentData = data;
            preencherFormulario();
            renderizarModalidades();
            renderizarCampeonatos();
        }

        function preencherFormulario() {
            document.getElementById('titulo').value = currentData.titulo || '';
            document.getElementById('subtitulo').value = currentData.subtitulo || '';
            document.getElementById('data').value = currentData.data || '';
            document.getElementById('textoExtra').value = currentData.textoExtra || '';

            const preview = document.getElementById('imagemPreview');
            const container = document.getElementById('previewContainer');
            const hidden = document.getElementById('imagemBase64');
            if (currentData.imagem && currentData.imagem.startsWith('data:image')) {
                preview.src = currentData.imagem;
                container.classList.remove('hidden');
                hidden.value = currentData.imagem;
            } else {
                preview.src = '';
                container.classList.add('hidden');
                hidden.value = '';
            }
        }

        // =============================================================
        // MODALIDADES
        // =============================================================
        function renderizarModalidades() {
            const list = document.getElementById('modalidadesList');
            if (!currentData.modalidades || currentData.modalidades.length === 0) {
                list.innerHTML = '<div class="empty-msg">Nenhuma modalidade cadastrada.</div>';
                return;
            }
            list.innerHTML = currentData.modalidades.map((m, idx) => `
                <div class="list-item" data-index="${idx}">
                    <div class="info">
                        <strong><i class="fas ${m.icone || 'fa-futbol'}"></i> ${escapeHtml(m.nome)}</strong>
                        <span class="desc">${escapeHtml(m.descricao)}</span>
                        ${m.tag ? `<span class="badge">${escapeHtml(m.tag)}</span>` : ''}
                    </div>
                    <div class="actions">
                        <button class="btn btn-warning btn-sm editar-modalidade" data-index="${idx}"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger btn-sm remover-modalidade" data-index="${idx}"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.remover-modalidade').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (confirm('Remover esta modalidade?')) {
                        currentData.modalidades.splice(idx, 1);
                        renderizarModalidades();
                        showToast('Modalidade removida.');
                    }
                });
            });

            document.querySelectorAll('.editar-modalidade').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    const m = currentData.modalidades[idx];
                    const novoNome = prompt('Nome da modalidade:', m.nome);
                    if (novoNome !== null) {
                        const novaDesc = prompt('Descrição:', m.descricao);
                        if (novaDesc !== null) {
                            const novaTag = prompt('Tag (opcional):', m.tag || '');
                            const iconeAtual = m.icone || 'fa-futbol';
                            const escolha = prompt('Ícone (classe FontAwesome, ex: fa-futbol):', iconeAtual);
                            m.nome = novoNome.trim() || m.nome;
                            m.descricao = novaDesc.trim() || m.descricao;
                            m.tag = novaTag.trim() || '';
                            if (escolha && escolha.trim()) m.icone = escolha.trim();
                            renderizarModalidades();
                            showToast('Modalidade atualizada.');
                        }
                    }
                });
            });
        }

        document.getElementById('addModalidadeBtn').addEventListener('click', function() {
            const nome = prompt('Nome da modalidade:');
            if (!nome) return;
            const desc = prompt('Descrição:');
            if (desc === null) return;
            const tag = prompt('Tag (opcional):') || '';
            const icone = prompt('Ícone (classe FontAwesome, ex: fa-futbol):', 'fa-futbol') || 'fa-futbol';
            currentData.modalidades.push({
                icone: icone.trim(),
                nome: nome.trim(),
                descricao: desc.trim(),
                tag: tag.trim()
            });
            renderizarModalidades();
            showToast('Modalidade adicionada.');
        });

        // =============================================================
        // CAMPEONATOS
        // =============================================================
        function renderizarCampeonatos() {
            const list = document.getElementById('campeonatosList');
            if (!currentData.campeonatos || currentData.campeonatos.length === 0) {
                list.innerHTML = '<div class="empty-msg">Nenhum campeonato cadastrado.</div>';
                return;
            }
            list.innerHTML = currentData.campeonatos.map((c, idx) => `
                <div class="list-item" data-index="${idx}">
                    <div class="info">
                        <strong>${escapeHtml(c.titulo)}</strong>
                        <span class="desc">
                            ${c.data ? `<i class="fas fa-calendar"></i> ${escapeHtml(c.data)}` : ''}
                            ${c.participantes ? ` | <i class="fas fa-users"></i> ${escapeHtml(c.participantes)}` : ''}
                            ${c.local ? ` | <i class="fas fa-map-pin"></i> ${escapeHtml(c.local)}` : ''}
                            ${c.status ? ` | <span class="badge" style="background:#004aad;color:#fff;">${escapeHtml(c.status)}</span>` : ''}
                        </span>
                    </div>
                    <div class="actions">
                        <button class="btn btn-warning btn-sm editar-campeonato" data-index="${idx}"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger btn-sm remover-campeonato" data-index="${idx}"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.remover-campeonato').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (confirm('Remover este campeonato?')) {
                        currentData.campeonatos.splice(idx, 1);
                        renderizarCampeonatos();
                        showToast('Campeonato removido.');
                    }
                });
            });

            document.querySelectorAll('.editar-campeonato').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    const c = currentData.campeonatos[idx];
                    const novoTitulo = prompt('Título:', c.titulo);
                    if (novoTitulo !== null) {
                        const novaData = prompt('Data (ex: 15/03 a 15/12/2026):', c.data || '');
                        const novoParticipantes = prompt('Participantes (ex: 8 equipes):', c.participantes || '');
                        const novoLocal = prompt('Local:', c.local || '');
                        const novoStatus = prompt('Status (andamento, aberto, realizado):', c.status || '');
                        c.titulo = novoTitulo.trim() || c.titulo;
                        c.data = novaData ? novaData.trim() : '';
                        c.participantes = novoParticipantes ? novoParticipantes.trim() : '';
                        c.local = novoLocal ? novoLocal.trim() : '';
                        c.status = novoStatus ? novoStatus.trim() : '';
                        renderizarCampeonatos();
                        showToast('Campeonato atualizado.');
                    }
                });
            });
        }

        document.getElementById('addCampeonatoBtn').addEventListener('click', function() {
            const titulo = prompt('Título do campeonato:');
            if (!titulo) return;
            const data = prompt('Data (ex: 15/03 a 15/12/2026):') || '';
            const participantes = prompt('Participantes (ex: 8 equipes):') || '';
            const local = prompt('Local:') || '';
            const status = prompt('Status (andamento, aberto, realizado):', 'aberto') || 'aberto';
            currentData.campeonatos.push({
                titulo: titulo.trim(),
                data: data.trim(),
                participantes: participantes.trim(),
                local: local.trim(),
                status: status.trim()
            });
            renderizarCampeonatos();
            showToast('Campeonato adicionado.');
        });

        // =============================================================
        // UPLOAD DE IMAGEM
        // =============================================================
        document.getElementById('imagemUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const base64 = ev.target.result;
                document.getElementById('imagemBase64').value = base64;
                document.getElementById('imagemPreview').src = base64;
                document.getElementById('previewContainer').classList.remove('hidden');
                currentData.imagem = base64;
                showToast('Imagem carregada.');
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('removerImagem').addEventListener('click', function() {
            document.getElementById('imagemPreview').src = '';
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('imagemBase64').value = '';
            currentData.imagem = '';
            showToast('Imagem removida.');
        });

        // =============================================================
        // SALVAR
        // =============================================================
        document.getElementById('formEsportiva').addEventListener('submit', function(e) {
            e.preventDefault();

            currentData.titulo = document.getElementById('titulo').value.trim();
            currentData.subtitulo = document.getElementById('subtitulo').value.trim();
            currentData.data = document.getElementById('data').value.trim();
            currentData.textoExtra = document.getElementById('textoExtra').value.trim();

            if (!currentData.imagem) {
                const hiddenImg = document.getElementById('imagemBase64').value;
                if (hiddenImg) currentData.imagem = hiddenImg;
            }

            const stored = JSON.parse(localStorage.getItem('assga_conteudos') || '{}');
            stored.esportiva = currentData;
            localStorage.setItem('assga_conteudos', JSON.stringify(stored));

            showToast('Dados salvos com sucesso!');
        });

        // =============================================================
        // RECARREGAR
        // =============================================================
        document.getElementById('btnRecarregar').addEventListener('click', function() {
            carregarDados();
            showToast('Dados recarregados.');
        });

        // =============================================================
        // INICIALIZAR
        // =============================================================
        document.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
