<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esportiva - ASSGA</title>
    <link rel="icon" href="src/imagens/Assga_foto.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* RESET e estilos gerais */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f5f7fa; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* HEADER */
        header { background: linear-gradient(135deg, #003366, #004aad); color: #fff; padding: 18px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 4px 20px rgba(0,51,102,0.25); position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
        .logo-area img { width: 48px; height: 56px; object-fit: cover; border-radius: 8px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
        .logo-text { font-size: 24px; font-weight: 800; letter-spacing: 1px; background: linear-gradient(135deg, #ffd700, #ffed4e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        nav a { color: #fff; text-decoration: none; font-weight: 600; padding: 8px 16px; border-radius: 30px; transition: 0.3s; }
        nav a:hover { background: rgba(255,215,0,0.2); color: #ffd700; }

        /* BANNER (HERO) */
        .hero { background: linear-gradient(135deg, #003366, #1a5276); padding: 50px 20px 40px; text-align: center; color: #fff; border-bottom: 4px solid #ffd700; }
        .hero h1 { font-size: 2.8rem; font-weight: 800; }
        .hero h1 i { color: #ffd700; margin-right: 12px; }
        .hero p { font-size: 1.2rem; opacity: 0.9; max-width: 600px; margin: 8px auto 0; }
        .hero img { max-width: 100%; max-height: 300px; border-radius: 12px; margin-top: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }

        /* SEÇÃO CONTEÚDO EXTRA */
        .extra-text { background: #fff; border-radius: 16px; padding: 30px; margin: 30px 0; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .extra-text h2 { color: #003366; margin-bottom: 16px; }

        /* MODALIDADES E CAMPEONATOS */
        .section-title { color: #003366; font-size: 2rem; margin: 40px 0 20px; }
        .section-title i { color: #b22234; margin-right: 12px; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card-item { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); border-left: 5px solid #003366; transition: 0.3s; }
        .card-item:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,51,102,0.12); }
        .card-item .icon { font-size: 2rem; color: #b22234; margin-bottom: 8px; }
        .card-item h3 { color: #003366; margin-bottom: 6px; }
        .card-item p { color: #475569; line-height: 1.6; }
        .card-item .tag { display: inline-block; background: #ffd700; color: #003366; padding: 2px 12px; border-radius: 30px; font-size: 0.75rem; font-weight: 700; margin-top: 6px; }
        .card-item .meta { font-size: 0.9rem; color: #64748b; display: block; margin-top: 8px; }

        /* LISTA DE ESPORTIVAS (cards grandes) */
        .esportivas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; margin-top: 20px; }
        .card { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.08); transition: 0.4s; border: 1px solid #e9edf2; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 16px 50px rgba(0,51,102,0.15); border-color: #ffd700; }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #e6edf5; }
        .card-body { padding: 20px 22px 24px; }
        .card-body h3 { color: #003366; font-size: 1.4rem; }
        .card-body .data { font-size: 0.9rem; color: #64748b; margin-bottom: 12px; }
        .card-body .data i { color: #004aad; margin-right: 6px; }
        .card-body .desc { color: #334155; line-height: 1.6; }
        .card-body .desc a { color: #004aad; font-weight: 600; text-decoration: none; }
        .card-body .desc a:hover { text-decoration: underline; }

        .empty-state { text-align: center; padding: 60px 20px; color: #66788a; }
        .empty-state i { font-size: 4rem; color: #b22234; display: block; margin-bottom: 16px; }

        footer { background: #063b6d; color: #fff; text-align: center; padding: 20px; margin-top: 40px; }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .grid-cards { grid-template-columns: 1fr; }
            .esportivas-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo-area">
        <img src="src/imagens/Assga_foto.jpg" alt="ASSGA" id="logoImg">
        <span class="logo-text" id="logoTxt">ASSGA</span>
    </a>
    <nav>
        <a href="index.html"><i class="fas fa-house"></i> Home</a>
        <a href="esportiva.html" style="background:rgba(255,215,0,0.2);"><i class="fas fa-futbol"></i> Esportivas</a>
        <a href="login.html"><i class="fas fa-id-card"></i> Área do Sócio</a>
    </nav>
</header>

<!-- BANNER (HERO) -->
<section class="hero" id="heroSection">
    <h1><i class="fas fa-futbol"></i> <span id="heroTitulo">Nossas Esportivas</span></h1>
    <p id="heroSubtitulo">Conheça as modalidades e campeonatos da ASSGA</p>
    <div id="heroImagemContainer"></div>
</section>

<main class="container">
    <!-- TEXTO EXTRA -->
    <div class="extra-text" id="extraTextoContainer">
        <h2><i class="fas fa-info-circle"></i> Sobre a Esportiva</h2>
        <div id="extraTextoContent">Conteúdo extra será carregado aqui.</div>
    </div>

    <!-- MODALIDADES -->
    <h2 class="section-title"><i class="fas fa-list"></i> Modalidades</h2>
    <div class="grid-cards" id="modalidadesContainer">
        <!-- renderizado via JS -->
    </div>

    <!-- CAMPEONATOS -->
    <h2 class="section-title"><i class="fas fa-trophy"></i> Campeonatos</h2>
    <div class="grid-cards" id="campeonatosContainer">
        <!-- renderizado via JS -->
    </div>

    <!-- ESPORTIVAS (cards) -->
    <h2 class="section-title"><i class="fas fa-calendar-alt"></i> Próximos Eventos</h2>
    <div id="esportivasList" class="esportivas-grid">
        <!-- renderizado via JS -->
    </div>
</main>

<footer>
    © 2026 ASSGA - Associação Desportiva
</footer>

<script>
    // ===== UTILITÁRIOS =====
    function escapeHtml(text) {
        if (!text) return '';
        return String(text).replace(/[&<>"']/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            if (m === "'") return '&#039;';
            return m;
        });
    }

    function isLink(text) {
        return /^https?:\/\/\S+/i.test(text.trim());
    }

    // ===== CARREGAR LOGO =====
    function carregarLogo() {
        try {
            const config = JSON.parse(localStorage.getItem('assga_config') || '{}');
            const img = document.getElementById('logoImg');
            const txt = document.getElementById('logoTxt');
            if (img && config.logoImg && config.logoImg.startsWith('data:image')) {
                img.src = config.logoImg;
            }
            if (txt && config.logoTxt) {
                txt.textContent = config.logoTxt;
            }
        } catch (e) { /* ignora */ }
    }

    // ===== CARREGAR CONTEÚDO DA ESPORTIVA (ABA "Esportiva") =====
    function carregarConteudoEsportiva() {
        let data = {};
        try {
            const stored = JSON.parse(localStorage.getItem('assga_conteudos') || '{}');
            data = stored.esportiva || {};
        } catch (e) { data = {}; }

        // Título e subtítulo do banner
        document.getElementById('heroTitulo').textContent = data.titulo || 'Nossas Esportivas';
        document.getElementById('heroSubtitulo').textContent = data.subtitulo || 'Conheça as modalidades e campeonatos da ASSGA';

        // Imagem do banner
        const imgContainer = document.getElementById('heroImagemContainer');
        if (data.imagem && data.imagem.startsWith('data:image')) {
            imgContainer.innerHTML = `<img src="${data.imagem}" alt="Banner Esportiva">`;
        } else {
            imgContainer.innerHTML = '';
        }

        // Texto extra
        const extraContent = document.getElementById('extraTextoContent');
        if (data.textoExtra) {
            extraContent.innerHTML = data.textoExtra;
        } else {
            extraContent.innerHTML = 'Nenhum texto extra definido.';
        }

        // Modalidades
        const modalidades = data.modalidades || [];
        const modalContainer = document.getElementById('modalidadesContainer');
        if (modalidades.length === 0) {
            modalContainer.innerHTML = '<div class="empty-state"><i class="fas fa-futbol"></i><p>Nenhuma modalidade cadastrada.</p></div>';
        } else {
            modalContainer.innerHTML = modalidades.map(m => `
                <div class="card-item">
                    <div class="icon"><i class="fas ${m.icone || 'fa-futbol'}"></i></div>
                    <h3>${escapeHtml(m.nome)}</h3>
                    <p>${escapeHtml(m.descricao)}</p>
                    ${m.tag ? `<span class="tag">${escapeHtml(m.tag)}</span>` : ''}
                </div>
            `).join('');
        }

        // Campeonatos
        const campeonatos = data.campeonatos || [];
        const campContainer = document.getElementById('campeonatosContainer');
        if (campeonatos.length === 0) {
            campContainer.innerHTML = '<div class="empty-state"><i class="fas fa-trophy"></i><p>Nenhum campeonato cadastrado.</p></div>';
        } else {
            campContainer.innerHTML = campeonatos.map(c => `
                <div class="card-item">
                    <h3>${escapeHtml(c.titulo)}</h3>
                    <p>
                        ${c.data ? `<span class="meta"><i class="fas fa-calendar"></i> ${escapeHtml(c.data)}</span>` : ''}
                        ${c.participantes ? `<span class="meta"><i class="fas fa-users"></i> ${escapeHtml(c.participantes)}</span>` : ''}
                        ${c.local ? `<span class="meta"><i class="fas fa-map-pin"></i> ${escapeHtml(c.local)}</span>` : ''}
                        ${c.status ? `<span class="meta" style="background:#004aad;color:#fff;padding:2px 10px;border-radius:20px;">${escapeHtml(c.status)}</span>` : ''}
                    </p>
                </div>
            `).join('');
        }
    }

    // ===== CARREGAR LISTA DE ESPORTIVAS (CARDS) =====
    function carregarEsportivas() {
        const container = document.getElementById('esportivasList');
        let lista = [];
        try {
            const stored = localStorage.getItem('assga_esportivas');
            lista = stored ? JSON.parse(stored) : [];
        } catch (e) { lista = []; }

        if (lista.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-futbol"></i><p>Nenhum evento esportivo programado.</p></div>`;
            return;
        }

        // Ordenar por data (se possível)
        lista.sort((a, b) => {
            const da = new Date(a.data);
            const db = new Date(b.data);
            if (!isNaN(da) && !isNaN(db)) return da - db;
            return 0;
        });

        container.innerHTML = lista.map(item => {
            let desc = escapeHtml(item.texto || '');
            if (isLink(item.texto)) {
                desc = `<a href="${escapeHtml(item.texto.trim())}" target="_blank" rel="noopener">${escapeHtml(item.texto.trim())}</a>`;
            }
            return `
                <div class="card">
                    <img class="card-img" src="${item.imagem || 'src/imagens/avatar-padrao.jpg'}" alt="${escapeHtml(item.titulo)}" loading="lazy">
                    <div class="card-body">
                        <h3>${escapeHtml(item.titulo)}</h3>
                        ${item.data ? `<div class="data"><i class="fas fa-calendar-alt"></i> ${escapeHtml(item.data)}</div>` : ''}
                        <div class="desc">${desc}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ===== INICIALIZAR =====
    document.addEventListener('DOMContentLoaded', function() {
        carregarLogo();
        carregarConteudoEsportiva();
        carregarEsportivas();
    });
</script>
</body>
</html>
